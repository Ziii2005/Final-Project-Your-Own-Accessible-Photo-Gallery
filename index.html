<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery | Luxury Showcase</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Showcase</h1>
        
        <div id="image">
            <p>Hover or tab over an image below to view details.</p>
        </div>

        <div id="gallery">
            <img class="preview" alt="Serene Mountain Lake Landscape" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
            
            <img class="preview" alt="Adorable Pug Puppy Wrapped in Blanket" src="https://images.unsplash.com/photo-1517423568366-8b83523034fd?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
            
            <img class="preview" alt="Yosemite National Park Valley View" src="https://images.unsplash.com/photo-1426604966148-72b5e522902d?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
            
            <img class="preview" alt="Winter Camping in Snowy Mountains" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
            
            <img class="preview" alt="Classic Historic European Castle" src="https://images.unsplash.com/photo-1547926127-1c6f50b86a87?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
            
            <img class="preview" alt="Powerful Ocean Waves Crashing on Cliffs" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=400&h=400&auto=format&fit=crop" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        </div>
    </main>
</body>
</html>
